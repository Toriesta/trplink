<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F4F0E6">
<meta name="color-scheme" content="light">
<meta name="screen-orientation" content="portrait">
<meta name="x5-orientation" content="portrait">
<title>TRP 任务台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 启动屏：深紫底，轨道标自绘 + 字标上浮 + 进度线 -->
<div id="splash" class="splash">
  <div class="splash-glow" aria-hidden="true"></div>
  <div class="splash-inner">
    <div class="splash-mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="orbit" cx="32" cy="32" r="24" pathLength="100"
                fill="none" stroke="#F4F0E6" stroke-width="3.2"
                stroke-linecap="round" stroke-dasharray="40 10 40 10"
                stroke-dashoffset="100" transform="rotate(-32 32 32)"/>
        <rect class="core" x="24.5" y="24.5" width="15" height="15" rx="2.4"
              fill="#FF6E5B" transform="rotate(45 32 32)"/>
      </svg>
    </div>
    <div class="splash-word" aria-label="TRP TASKS">
      <span>T</span><span>R</span><span>P</span><i></i><span class="dim">TASKS</span>
    </div>
    <div class="splash-sub">天 枢 ・ 任 务 台</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <div class="splash-foot">TSRELPUS ARCHITECTURE</div>
</div>

<div class="glow" aria-hidden="true"></div>

<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-dasharray="52 26" transform="rotate(-32 16 16)"/>
        <rect x="12" y="12" width="8" height="8" rx="1.6" fill="#FF6E5B"
              transform="rotate(45 16 16)"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">TRP 任务台</span>
        <span class="brand-sub">TASKS / 接单</span>
      </div>
    </div>
    <button class="icon-btn" id="btnRefresh" type="button" aria-label="刷新任务">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"/>
        <path d="M20 5.5V11h-5.5" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div class="pull" id="pull" aria-hidden="true">
    <span class="pull-ring"></span>
    <span class="pull-text">下拉刷新</span>
  </div>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" role="tablist">
    <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
    <button class="tab is-active" data-tab="tasks" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="16" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="4" y="14" width="16" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span>任务</span>
    </button>
    <button class="tab" data-tab="mine" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M4.8 20c1.1-3.6 3.9-5.4 7.2-5.4S18.1 16.4 19.2 20" fill="none"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>我的</span>
    </button>
    <button class="tab" data-tab="settings" type="button" role="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 3.6v2.2M12 18.2v2.2M4.6 12h2.2M17.2 12h2.2M6.8 6.8l1.6 1.6M15.6 15.6l1.6 1.6M17.2 6.8l-1.6 1.6M8.4 15.6l-1.6 1.6"
              fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<!-- 新版本弹窗：发现新版本时自动弹出，不用用户自己去找更新入口 -->
<div id="updateModal" class="update-modal" hidden>
  <div class="update-mask" data-update-close="1"></div>
  <section class="update-card" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
    <div class="update-tag">UPDATE</div>
    <div class="update-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-dasharray="38 8" transform="rotate(-32 24 24)"/>
        <path d="M24 31V17M18 23l6-6 6 6" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 id="updateModalTitle">发现新版本</h2>
    <p class="update-note" id="updateModalNotes"></p>
    <div class="update-ver">当前 v<span id="updateModalCurrent"></span> → 最新 v<span id="updateModalVersion"></span></div>
    <a class="btn ink block" id="updateModalGo" href="#" target="_blank" rel="noopener">立即更新</a>
    <button class="btn ghost block" id="updateModalLater" type="button">稍后提醒</button>
  </section>
</div>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="任务详情">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
